[project]
name = "parsec-rdp-fix"
version = "0.1.0"
description = "One-time Windows fix for Parsec's service-launched RDP session logoff"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "customtkinter==5.2.2",
  "psutil>=6,<8",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6.16,<7"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
