name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src main.py tests
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ParsecRDPFix --paths src --collect-all customtkinter --add-data "locales;locales" main.py
      - name: SHA-256
        run: python scripts/checksum.py
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Parsec RDP Fix ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/ParsecRDPFix.exe
            dist/SHA256SUMS.txt
