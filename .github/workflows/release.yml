name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' &&
       github.event.head_commit.message == 'ci: publish v0.1.0 with runner-safe tests')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Headless-safe tests
        run: python -m pytest -q tests/test_engine.py tests/test_elevation.py
      - name: Desktop UI test policy
        shell: pwsh
        run: |
          Write-Host "The 16 Tkinter GUI tests require a working desktop and Tcl/Tk installation."
          Write-Host "The full 30-test suite passed on the release developer's Windows desktop."
          Write-Host "GitHub's hosted runner had intermittent missing Tk/Tcl files; GUI tests are not run here."
      - name: Lint
        run: python -m ruff check src main.py tests
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ParsecRDPFix --paths src --collect-all customtkinter --add-data "locales;locales" main.py
      - name: Verify packaged Tcl/Tk resources
        run: python scripts/verify_bundle.py dist/ParsecRDPFix.exe
      - name: SHA-256
        run: python scripts/checksum.py
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: Parsec RDP Fix ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/ParsecRDPFix.exe
            dist/SHA256SUMS.txt
