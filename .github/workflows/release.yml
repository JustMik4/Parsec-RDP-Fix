name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' &&
       github.event.head_commit.message == 'ci: publish v0.1.0 after fixing Windows Tk tests')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Headless-safe tests
        run: python -m pytest -q tests/test_engine.py tests/test_elevation.py
      - name: Check Tk availability
        id: tkinter
        shell: pwsh
        run: |
          python -c "import tkinter as tk; window = tk.Tk(); window.withdraw(); window.destroy()" 2>$null
          if ($LASTEXITCODE -eq 0) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "Tcl/Tk is unavailable on this Windows runner. GUI tests were validated locally and cannot run here."
            "available=false" >> $env:GITHUB_OUTPUT
          }
      - name: GUI tests
        if: steps.tkinter.outputs.available == 'true'
        run: python -m pytest -q tests/test_ui.py tests/test_transition.py tests/test_theme.py
      - name: Lint
        run: python -m ruff check src main.py tests
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ParsecRDPFix --paths src --collect-all customtkinter --add-data "locales;locales" main.py
      - name: SHA-256
        run: python scripts/checksum.py
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: Parsec RDP Fix ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/ParsecRDPFix.exe
            dist/SHA256SUMS.txt
